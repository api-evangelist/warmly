    url: rate-limits/warmly-rate-limits.yml
- name: Warmly MCP Server
  description: >-
    Hosted, remote Model Context Protocol server exposing Warmly's agent-tools
    registry to MCP-capable agents (Claude Desktop, Claude Code, Cursor, Zed).
    Documented read tools cover identified website visitors, company-level warm
    accounts, third-party intent signals and the organization credit balance;
    async write tools push identified contacts into HubSpot, Salesforce and
    sequences. Authenticates with OAuth 2.0 authorization code + PKCE against a
    WorkOS AuthKit authorization server, discovered through RFC 9728
    protected-resource metadata served at the API host.
  humanURL: https://help.warmly.ai/articles/4646691220-warmly-technical-documentation-mcp-server
  baseURL: https://opps-api.getwarmly.com/api/mcp
