aid: warmly
name: Warmly
description: >-
  Warmly is a signal-based revenue orchestration and AI go-to-market platform
  that de-anonymizes website visitors down to the individual person, unifies
  first-, second-, and third-party intent signals in a unified Context Graph,
  and runs two autonomous agents — an Inbound Agent that converts on-site
  visitors through AI chat and an outbound TAM Agent that orchestrates
  prospecting across email, LinkedIn, and ads. Warmly exposes a REST API and a
  hosted, OAuth-authenticated MCP server (both live at opps-api.getwarmly.com)
  that let agents list warm visitors and accounts, look up third-party intent
  signals, check credit balances, and push identified contacts into HubSpot,
  Salesforce, and sequences — with outbound webhooks reporting agent-tool
  execution status and delivering intent signals to downstream automations.
