apis:
- name: Warmly REST API
  description: >-
    REST API for Warmly's agent-tools surface — discover available tools,
    execute read tools (warm visitors, warm accounts, third-party intent
    signals, credit balance) and async write tools (push contacts to
    HubSpot/Salesforce/sequences), and retrieve execution records by id.
    Authenticates with a per-organization Bearer API key.
  humanURL: https://help.warmly.ai/articles/9641856032-warmly-technical-documentation-rest-api
  baseURL: https://opps-api.getwarmly.com/api
