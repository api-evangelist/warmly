summary: >-
  Warmly's standards posture is lopsided in an interesting way: the agent-facing
  authorization path is genuinely standards-conformant — RFC 9728 protected-resource
  metadata, an RFC 8414 / OIDC authorization server, PKCE S256, dynamic client
  registration, and a correct WWW-Authenticate challenge — while the HTTP API layer
  conforms to nothing. There is no OpenAPI, no RFC 9457 problem details, no RFC 9116
  security.txt, no RFC 8594 sunset headers and no RateLimit header standard.
