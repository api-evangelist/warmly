summary: >-
  Warmly ships NO first-party client SDK in any language registry. Every public
  registry was queried and none returns a Warmly-published package. The only
  first-party distributed artifacts are an unpinned CDN-hosted browser widget and a
  Salesforce managed package installed from AppExchange — neither of which is an API
  client library. A developer or agent integrating the REST API or the MCP server
  writes raw HTTP.
