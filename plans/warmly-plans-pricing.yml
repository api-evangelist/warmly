summary: >-
  Warmly publishes two distinct commercial surfaces and they do not share a price
  book. The API/MCP surface is self-serve, credit-metered and starts free at 250
  credits/month with paid tiers at $99-$499/month. The platform surface sold on the
  pricing page is annual/quarterly contract pricing at $10,000-$30,000/year with a
  10,000 credit/month floor. The plans below are the API/MCP tiers, because those are
  what an agent or developer can actually buy; the platform contracts are recorded
  separately under platform_plans.
