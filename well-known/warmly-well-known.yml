    served documents, and are recorded as misses.
- host: https://status.getwarmly.com
  path: /.well-known/security.txt
  observed_status: 200
  verdict: not-warmly
  detail: >-
    A real RFC 9116 security.txt is served here, but it belongs to Rootly — the
    status-page vendor (Contact mailto:security@rootly.com, Policy
