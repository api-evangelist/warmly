false_positives:
- hosts: [https://opps.getwarmly.com, https://getwarmly.com, https://www.getwarmly.com]
  observed_status: 200
  verdict: not-a-document
  detail: >-
    Every /.well-known/* path on these hosts returns HTTP 200 with the Webflow
    marketing page or the app single-page-app shell (Content-Type text/html,
