    document on a CNAMEd subdomain, not Warmly's, and is deliberately NOT credited
    to Warmly or saved as warmly-security.txt.
security_txt:
  served: false
  note: Warmly serves no first-party security.txt on any host. Its disclosure route is the SafeBase trust center — see security/warmly-vulnerability-disclosure.yml.
