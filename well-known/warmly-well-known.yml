generated: '2026-08-13'
method: probed
source: live GET of /.well-known/* across every Warmly host in apis.yml
summary: >-
  Warmly serves exactly one first-party /.well-known document: RFC 9728 OAuth
  Protected Resource Metadata at the API host, which is what makes the hosted MCP
  server discoverable to an OAuth-capable agent. It names an external WorkOS
  AuthKit tenant as the authorization server; that tenant's RFC 8414 / OIDC
  discovery documents are captured here as the delegated auth surface. No
  security.txt, api-catalog, ai-plugin.json or agent card is served on any host.
hosts_probed:
- https://opps-api.getwarmly.com
- https://warmly.ai
- https://www.warmly.ai
- https://help.warmly.ai
- https://opps.getwarmly.com
- https://getwarmly.com
- https://www.getwarmly.com
- https://status.getwarmly.com
- https://vigorous-paper-03.authkit.app
documents:
- host: https://opps-api.getwarmly.com
  path: /.well-known/oauth-protected-resource
  spec: RFC 9728 OAuth 2.0 Protected Resource Metadata
  status: 200
  content_type: application/json
  file: warmly-oauth-protected-resource.json
  note: >-
    Declares resource https://opps-api.getwarmly.com/api/mcp, bearer_methods_supported
    [header], scopes_supported [] (empty), and resource_documentation
    https://docs.getwarmly.com/mcp — a documentation host that does not resolve in DNS.
- host: https://vigorous-paper-03.authkit.app
  path: /.well-known/oauth-authorization-server
  spec: RFC 8414 OAuth 2.0 Authorization Server Metadata
  status: 200
  content_type: application/json
  file: warmly-oauth-authorization-server.json
  first_party: false
  note: >-
    Third-party host, but this is the authorization server Warmly's own
    RFC 9728 metadata points at — a WorkOS AuthKit tenant. Captured because it is
    the only place the MCP server's OAuth endpoints, grant types and scopes are published.
- host: https://vigorous-paper-03.authkit.app
  path: /.well-known/openid-configuration
  spec: OpenID Connect Discovery 1.0
  status: 200
  content_type: application/json
  file: warmly-openid-configuration.json
  first_party: false
  note: Same delegated AuthKit tenant; adds userinfo_endpoint and client_credentials grant.
